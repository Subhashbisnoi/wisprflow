# Nginx reverse proxy for the Ledgerline API.
# Installed by deploy/ec2/setup.sh to /etc/nginx/sites-available/ledgerline-api, with
# __SERVER_NAME__ replaced by your domain (e.g. apiwish.collabup.co.in) and __API_PORT__ by
# the local Uvicorn port. Only this server_name is answered, so other sites on the same
# Nginx (and its default server) are left untouched.
# certbot --nginx later adds the HTTPS server block and the HTTP -> HTTPS redirect.

upstream ledgerline_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

log_format ledgerline '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                      '$request_time "$http_user_agent" request_id=$request_id';

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    access_log /var/log/nginx/ledgerline-api.access.log ledgerline;
    error_log  /var/log/nginx/ledgerline-api.error.log warn;

    server_tokens off;

    # The web app sends one file per request (MAX_UPLOAD_MB, default 15). The API accepts
    # up to MAX_FILES_PER_UPLOAD files in one request, so leave headroom for API clients.
    client_max_body_size 40m;
    client_body_timeout 60s;

    # Extraction can run during the request when JOB_QUEUE_BACKEND=sync.
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://ledgerline_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same id in the Nginx log, the API's JSON logs and the error response body.
        proxy_set_header X-Request-ID $request_id;
    }

    # Interactive API documentation.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://ledgerline_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        default_type application/json;
        return 200 '{"service":"ledgerline-api","health":"/api/v1/health","docs":"/docs"}';
    }

    location / {
        return 404;
    }
}
