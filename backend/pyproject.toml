[project]
name = "ledgerline-backend"
version = "0.1.0"
description = "Ledgerline accounts payable API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "pypdf[crypto]>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "openai>=1.50",
]

# Vercel imports `app` from app/asgi.py (app/main.py only exposes the create_app factory).
[tool.vercel]
entrypoint = "app.asgi:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "fpdf2>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PT"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Tests favour compact money literals (Decimal as D) and paired assertions.
"tests/**" = ["PT018", "N817"]
"scripts/**" = ["N817"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "fpdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
